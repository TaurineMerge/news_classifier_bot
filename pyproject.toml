[project]
name = "newsbot"
version = "0.1.0"
description = "Транскрибация голосовых новостей и определение их тематики"
readme = "README.md"
requires-python = ">=3.11"
# Зависимости общего пакета src/newsbot (ASR + классификатор) — их получают и ML, и сервисы
dependencies = [
    "faster-whisper>=1.1",
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
]

[dependency-groups]
# Telegram-бот (services/bot): `uv sync --group bot`
bot = [
    "aiogram>=3.13,<4",
    "pydantic-settings>=2.4,<3",
]
# Инструменты разработки — нужны всем
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
# Эксперименты ML-команды (ноутбуки, анализ). Сюда же добавлять torch, transformers и т.п.
ml = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbstripout>=0.7",
    "pandas>=2",
    "matplotlib>=3.8",
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
]

[tool.uv]
# `uv sync` по умолчанию ставит dev; ml — по запросу: `uv sync --group ml`
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbot"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# кириллица в строках и комментариях — норма для проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# в ноутбуках допустимы импорты не наверху и длинные строки
"*.ipynb" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
