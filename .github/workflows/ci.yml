name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked: упасть, если uv.lock не совпадает с pyproject.toml
        # ml — для проверок baseline, bot — для тестов бота
        run: uv sync --locked --group ml --group bot

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  docker-build:
    name: Docker build (bot)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/bot/Dockerfile
          push: false
          tags: newsbot-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
