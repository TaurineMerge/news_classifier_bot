# Локально:  docker compose up -d --build        (собрать образ из кода)
# На сервере: deploy/deploy.sh <tag>              (скачать готовый образ из GHCR)
# Перед первым запуском: заполнить .env (см. .env.example) и положить модель в ml/models/
services:
  bot:
    # Готовый образ из GitHub Container Registry; тег задаёт deploy.sh (по коммиту)
    image: ${BOT_IMAGE:-ghcr.io/taurinemerge/news_classifier_bot}:${BOT_TAG:-latest}
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./ml/models:/app/ml/models:ro   # классификатор (dvc pull или вручную)
      - whisper-cache:/cache            # веса whisper скачиваются один раз
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whisper-cache:
